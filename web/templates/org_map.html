{% extends "base.html" %}
{% block title %}Organization Map{% endblock %}
{% block head %}
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
    #cy { width: 100%; height: 600px; background: #0D1117; border-radius: 0.5rem; border: 1px solid #2D3B50; }
    #node-detail { min-width: 300px; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex items-center gap-4 mb-6">
        <h2 class="text-2xl font-bold">Organization Map</h2>
        <select id="org-select" onchange="loadOrg(this.value)"
            class="bg-gray-800 border border-gray-600 rounded px-3 py-1 text-sm">
            <option value="org_001" {% if org_id == 'org_001' %}selected{% endif %}>org_001 — The Enterprise</option>
            <option value="org_002" {% if org_id == 'org_002' %}selected{% endif %}>org_002 — The Factory</option>
            <option value="entity_005" {% if org_id == 'entity_005' %}selected{% endif %}>Entity_005 — The Architect</option>
        </select>
    </div>

    <div class="flex gap-4">
        <div class="flex-1">
            <div id="cy"></div>
        </div>
        <div id="node-detail" class="card p-4 hidden">
            <h3 class="text-lg font-semibold mb-3" id="detail-title">Select a node</h3>
            <div id="detail-content" class="text-sm space-y-2"></div>
        </div>
    </div>
</div>

<script>
let cy;

function initGraph(data) {
    if (cy) cy.destroy();
    cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [...data.nodes, ...data.edges],
        style: [
            {
                selector: 'node',
                style: {
                    'background-color': 'data(color)',
                    'label': 'data(label)',
                    'color': '#E5E7EB',
                    'font-size': '10px',
                    'text-valign': 'bottom',
                    'text-margin-y': '8px',
                    'width': '32px',
                    'height': '32px',
                    'border-width': '2px',
                    'border-color': '#374151',
                }
            },
            {
                selector: 'node[role="treasury"]',
                style: { 'width': '48px', 'height': '48px', 'font-size': '12px', 'font-weight': 'bold' }
            },
            {
                selector: 'node[role="deployer_cluster"]',
                style: { 'shape': 'round-rectangle', 'width': '80px', 'height': '32px', 'font-size': '9px' }
            },
            {
                selector: 'node[role="cex"]',
                style: { 'shape': 'diamond', 'width': '40px', 'height': '40px' }
            },
            {
                selector: 'edge',
                style: {
                    'width': 1.5,
                    'line-color': '#4B5563',
                    'target-arrow-color': '#4B5563',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier',
                    'label': 'data(label)',
                    'font-size': '8px',
                    'color': '#6B7280',
                    'text-rotation': 'autorotate',
                }
            },
            {
                selector: 'node:selected',
                style: { 'border-color': '#3B82F6', 'border-width': '3px' }
            }
        ],
        layout: { name: 'breadthfirst', directed: true, padding: 40, spacingFactor: 1.5 },
    });

    cy.on('tap', 'node', function(evt) {
        const d = evt.target.data();
        document.getElementById('node-detail').classList.remove('hidden');
        document.getElementById('detail-title').textContent = d.label || d.id;
        let html = '';
        if (d.address) html += '<p class="font-mono text-xs text-gray-400 break-all">' + d.address + '</p>';
        if (d.role) html += '<p><span class="text-gray-500">Role:</span> <span class="text-blue-400">' + d.role + '</span></p>';
        if (d.contracts !== undefined) html += '<p><span class="text-gray-500">Contracts:</span> ' + d.contracts + '</p>';
        if (d.address) html += '<p class="mt-2"><a href="/deployer/' + d.address + '" class="text-blue-400 underline text-xs">View profile →</a></p>';
        document.getElementById('detail-content').innerHTML = html;
    });
}

function loadOrg(orgId) {
    fetch('/api/org/' + orgId)
        .then(r => r.json())
        .then(data => initGraph(data));
}

// Load initial org
loadOrg('{{ org_id }}');
</script>
{% endblock %}
