{% extends "base.html" %}
{% block title %}Threat Feed{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Threat Feed</h2>

    <!-- Filters -->
    <div class="flex gap-3 mb-6">
        <select name="chain" hx-get="/threats" hx-target="#threat-list" hx-include="[name]"
            class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
            <option value="">All Chains</option>
            <option value="base" {% if chain == 'base' %}selected{% endif %}>Base</option>
            <option value="arbitrum" {% if chain == 'arbitrum' %}selected{% endif %}>Arbitrum</option>
            <option value="optimism" {% if chain == 'optimism' %}selected{% endif %}>Optimism</option>
        </select>
        <select name="priority" hx-get="/threats" hx-target="#threat-list" hx-include="[name]"
            class="bg-gray-800 border border-gray-600 rounded px-3 py-1.5 text-sm">
            <option value="">All Priorities</option>
            <option value="CRITICAL" {% if priority == 'CRITICAL' %}selected{% endif %}>Critical</option>
            <option value="HIGH" {% if priority == 'HIGH' %}selected{% endif %}>High</option>
            <option value="MEDIUM" {% if priority == 'MEDIUM' %}selected{% endif %}>Medium</option>
        </select>
    </div>

    <div id="threat-list">
        {% include "partials/threat_list.html" %}
    </div>
</div>
{% endblock %}
